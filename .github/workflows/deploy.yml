name: CI/CD Pipeline & Automated Deploy (nov-ad)

on:
  push:
    branches: [ main, feature-sarat ]
  workflow_dispatch:

concurrency:
  group: nov-ad-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Validate Code & Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build & Typecheck
        run: npm run build

  deploy-to-vps:
    name: Auto-Deploy to VPS Container
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "🚀 Auto-deploy triggered for branch: ${{ github.ref_name }}"

            if [ "${{ github.ref_name }}" = "feature-sarat" ]; then
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S bash -c '
                cd /data/alodoctor/preview-sarat
                git fetch origin feature-sarat
                git checkout feature-sarat
                git reset --hard origin/feature-sarat
                sed -i "s/export default defineConfig({/export default defineConfig({ base: \x27.\/\x27,/g" vite.config.ts
                docker build -t alo-preview-sarat:latest .
                docker rm -f alo-preview-sarat 2>/dev/null || true
                PG_PASS=$(docker inspect alo-postgres --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep POSTGRES_PASSWORD | cut -d= -f2- || true)
                MINIO_USER=$(docker inspect alo-minio --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep MINIO_ROOT_USER | cut -d= -f2- || true)
                MINIO_PASS=$(docker inspect alo-minio --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep MINIO_ROOT_PASSWORD | cut -d= -f2- || true)

                docker run -d --name alo-preview-sarat --restart always --network coolify \
                  -e DB_HOST=alo-postgres \
                  -e POSTGRES_USER=alo_admin \
                  -e POSTGRES_DB=alodoctor \
                  -e POSTGRES_PASSWORD="$PG_PASS" \
                  -e MINIO_ENDPOINT=alo-minio \
                  -e MINIO_ROOT_USER="${MINIO_USER:-alo_storage_admin}" \
                  -e MINIO_ROOT_PASSWORD="$MINIO_PASS" \
                  alo-preview-sarat:latest
                sleep 3
                docker logs --tail 30 alo-preview-sarat
              '
              echo "✅ Preview environment updated: https://ad.howtostart.in/feature-sarat/"

            elif [ "${{ github.ref_name }}" = "main" ]; then
              echo "${{ secrets.VPS_PASSWORD }}" | sudo -S bash -c '
                cd /data/alodoctor/nov-ad
                git fetch origin main
                git checkout main
                git reset --hard origin/main
                docker build -t alo-frontend:latest .
                docker rm -f alo-frontend 2>/dev/null || true
                PG_PASS=$(docker inspect alo-postgres --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep POSTGRES_PASSWORD | cut -d= -f2- || true)
                MINIO_USER=$(docker inspect alo-minio --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep MINIO_ROOT_USER | cut -d= -f2- || true)
                MINIO_PASS=$(docker inspect alo-minio --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep MINIO_ROOT_PASSWORD | cut -d= -f2- || true)

                docker run -d --name alo-frontend --restart always --network coolify -p 3000:80 \
                  -e DB_HOST=alo-postgres \
                  -e POSTGRES_USER=alo_admin \
                  -e POSTGRES_DB=alodoctor \
                  -e POSTGRES_PASSWORD="$PG_PASS" \
                  -e MINIO_ENDPOINT=alo-minio \
                  -e MINIO_ROOT_USER="${MINIO_USER:-alo_storage_admin}" \
                  -e MINIO_ROOT_PASSWORD="$MINIO_PASS" \
                  alo-frontend:latest
              '
              echo "✅ Production environment updated: https://ad.howtostart.in/"
            fi
