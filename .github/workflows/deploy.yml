name: CI/CD Pipeline & Automated Deploy (nov-ad)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: nov-ad-deploy
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Validate Code & Architecture
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        check: [lint, typecheck, schema-validation]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Matrix Validation
        run: |
          echo "Running check: ${{ matrix.check }}"
          if [ "${{ matrix.check }}" = "lint" ]; then
            npm run lint
          elif [ "${{ matrix.check }}" = "typecheck" ]; then
            npm run typecheck
          elif [ "${{ matrix.check }}" = "schema-validation" ]; then
            node -e "import fs from 'fs'; const c = JSON.parse(fs.readFileSync('./config/ai-orchestration.json')); console.log('Orchestration DAG valid. Max parallel:', c.orchestration.concurrency.max_parallel_sessions);"
          fi

  deploy-to-production:
    name: Auto-Deploy to Production VPS
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "${{ secrets.VPS_PASSWORD }}" | sudo -S bash -c 'cd /data/alodoctor/nov-ad && git fetch origin main && git reset --hard origin/main && docker build -t alo-frontend:latest . && docker rm -f alo-frontend && docker run -d --name alo-frontend --restart always --network coolify -p 3000:80 alo-frontend:latest'
