name: CI/CD Pipeline & Coolify Deploy (nov-ad)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: nov-ad-deploy
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Validate Code & Architecture
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        check: [lint, typecheck, schema-validation]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Matrix Validation
        run: |
          echo "Running check: ${{ matrix.check }}"
          if [ "${{ matrix.check }}" = "lint" ]; then
            npm run lint
          elif [ "${{ matrix.check }}" = "typecheck" ]; then
            npm run typecheck
          elif [ "${{ matrix.check }}" = "schema-validation" ]; then
            node -e "import fs from 'fs'; const c = JSON.parse(fs.readFileSync('./config/ai-orchestration.json')); console.log('Orchestration DAG valid. Max parallel:', c.orchestration.concurrency.max_parallel_sessions);"
          fi

  deploy-to-coolify:
    name: Trigger Coolify Auto-Deploy
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Notify Coolify Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK" ]; then
            echo "Triggering deployment on Coolify VPS..."
            curl -s -X GET "$COOLIFY_WEBHOOK" || curl -s -X POST "$COOLIFY_WEBHOOK"
            echo "Deploy hook sent successfully."
          else
            echo "COOLIFY_WEBHOOK_URL secret not configured yet. Skipping remote trigger."
          fi
