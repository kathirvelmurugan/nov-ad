services:
  alo-postgres:
    image: postgres:16-alpine
    container_name: alo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alodoctor
      POSTGRES_USER: alo_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (gitignored)}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /data/alodoctor/postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alo_admin -d alodoctor"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coolify

  alo-minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: alo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alo_storage_admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env (gitignored)}
    volumes:
      - /data/alodoctor/minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - coolify

networks:
  coolify:
    external: true
